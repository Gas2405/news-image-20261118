<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The World in One Day — Wednesday 18 November 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    background: #f7f2e7;
    color: #16130d;
    font-family: "Liberation Sans", Arial, sans-serif;
    padding: 30px 38px 24px 38px;
    display: flex; flex-direction: column;
  }
  .serif { font-family: "Liberation Serif", Georgia, serif; }

  /* ---------- masthead ---------- */
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14.5px; letter-spacing: 2.5px; font-weight: bold; color: #6b6151;
    border-bottom: 3px solid #16130d; padding-bottom: 7px;
  }
  .papername {
    text-align: center; font-size: 43px; font-weight: bold; letter-spacing: 6px;
    padding-top: 10px;
  }
  .dateline {
    text-align: center; font-size: 57px; font-weight: bold; letter-spacing: 1px;
    color: #a31621; padding: 2px 0 8px 0; white-space: nowrap;
  }
  .daterule { border-top: 6px solid #16130d; border-bottom: 1.5px solid #16130d; height: 4px; margin-bottom: 16px; }

  /* ---------- shared story bits ---------- */
  .kicker { font-size: 14.5px; font-weight: bold; letter-spacing: 2.2px; color: #a31621; }
  .caption { color: #33302a; line-height: 1.32; }

  /* ---------- lead ---------- */
  .lead { display: flex; gap: 26px; }
  .lead .txt { flex: 1; }
  .lead h1 { font-size: 47px; line-height: 1.08; font-weight: bold; padding: 6px 0 10px 0; }
  .lead .caption { font-size: 20.5px; }
  .lead .deck { font-size: 18.5px; font-style: italic; color: #57503f; line-height: 1.35; padding-top: 12px; }
  .lead .art { width: 352px; flex: none; }

  .rule { border-top: 2px solid #16130d; margin: 16px 0 14px 0; }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 30px; }
  .tile { display: flex; gap: 16px; padding: 13px 0 13px 0; border-top: 1.5px solid #b9b09c; }
  .tile .art { width: 104px; flex: none; }
  .tile h2 { font-size: 27.5px; line-height: 1.13; font-weight: bold; padding: 3px 0 5px 0; }
  .tile .caption { font-size: 17.5px; }

  /* ---------- bottom ---------- */
  .bottom { display: flex; gap: 16px; align-items: center; border-top: 2px solid #16130d; padding-top: 13px; margin-top: 2px; }
  .bottom .art { width: 76px; flex: none; }
  .bottom h2 { font-size: 27.5px; font-weight: bold; padding: 2px 0 4px 0; }
  .bottom .caption { font-size: 17.5px; }

  .markets {
    margin-top: 13px; background: #16130d; color: #f7f2e7;
    font-size: 15px; letter-spacing: 0.4px; padding: 8px 12px; white-space: nowrap; overflow: hidden;
  }
  .markets b { color: #e8b64c; letter-spacing: 1.6px; }
  .sources { margin-top: 9px; text-align: center; font-size: 13.5px; color: #6b6151; letter-spacing: 0.4px; }
</style>
</head>
<body>

  <div class="topline"><span>MAKE.FUN · DAILY NEWS IMAGE</span><span>THE DAY'S NEWS, ON ONE PAGE</span></div>
  <div class="papername serif">THE WORLD IN ONE DAY</div>
  <div class="dateline serif" id="dateline"></div>
  <div class="daterule"></div>

  <section class="lead" id="lead"></section>
  <div class="rule"></div>
  <section class="grid" id="grid"></section>
  <section class="bottom" id="bottom"></section>
  <div class="markets" id="markets"></div>
  <div class="sources" id="sources"></div>
